<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SST AI Tutor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="logo">
                <div class="logo-icon">🤖</div>

                <div>
                    <h1>SST AI</h1>
                    <span>Smart Social Science Tutor</span>
                </div>
            </div>

            <button class="new-chat">
                ＋ New Chat
            </button>

            <p class="subject-title">Subjects</p>

            <div class="subject active">🏛️ History</div>
            <div class="subject">🌍 Geography</div>
            <div class="subject">⚖️ Civics</div>
            <div class="subject">💰 Economics</div>

            <div class="sidebar-bottom">
                Class 9 SST AI
            </div>

        </aside>


        <main class="main">

            <header class="header">

                <div class="header-left">
                    <div class="status"></div>

                    <div>
                        <h2>SST AI Tutor</h2>
                        <p>Online • Ready to help</p>
                    </div>
                </div>

            </header>


            <section class="chat">

                <div class="chat-container">

                    <div class="welcome">

                        <div class="welcome-icon">
                            🤖
                        </div>

                        <h2>How can I help with SST?</h2>

                        <p>
                            Ask me anything about Class 9 Social Science.
                        </p>

                        <div class="quick-actions">

                            <button class="quick-btn">
                                📚 Explain a topic
                            </button>

                            <button class="quick-btn">
                                📝 Make notes
                            </button>

                            <button class="quick-btn">
                                🎯 Quiz me
                            </button>

                            <button class="quick-btn">
                                ❓ Important questions
                            </button>

                        </div>

                    </div>

                </div>

            </section>


            <div class="input-area">

                <div class="input-box">

                    <button class="icon-btn">
                        📎
                    </button>

                    <textarea
                        id="userInput"
                        placeholder="Ask your SST AI anything..."
                        rows="1">
                    </textarea>

                    <button class="icon-btn">
                        🎤
                    </button>

                    <button
                        class="send-btn"
                        onclick="sendMessage()">
                        ➤
                    </button>

                </div>

            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
